# Managed by code-flow: borrowed build machines. Changes are overwritten on the next sync.
name: runner
run-name: ${{ inputs.lease || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      lease:
        description: lease
        default: ''
      idle:
        description: idle
        default: 10m
      runs_on:
        description: machine
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm

permissions:
  packages: read

jobs:
  run:
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 360
    steps:
      - name: run
        env:
          FLOW_SERVER: ${{ secrets.FLOW_SERVER }}
          FLOW_TOKEN: ${{ secrets.FLOW_TOKEN }}
          FLOW_LEASE: ${{ inputs.lease }}
          FLOW_IDLE_EXIT: ${{ inputs.idle }}
          FLOW_QUIET: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          # stdout of the block below is discarded; fd 3 keeps the real stdout for ::add-mask:: commands
          exec 3>&1
          {
            set -e
            dir="$RUNNER_TEMP/fr"
            mkdir -p "$dir/ws"
            dl() { curl -fsSL --retry 3 "$FLOW_SERVER/api/open/runner/dist/latest/$1?token=$FLOW_TOKEN"; }
            if [ -n "$FLOW_LEASE" ]; then
              code=$(curl -sS -o "$dir/ts" -w '%{http_code}' -X POST -H "X-Runner-Token: $FLOW_TOKEN" -H 'Content-Type: application/json' \
                -d "{\"lease\":\"$FLOW_LEASE\"}" "$FLOW_SERVER/api/open/runner/lease/tailscale")
              if [ "$code" = 200 ]; then
                # values fetched at runtime are not masked automatically (only repo secrets are)
                printf '::add-mask::%s\n' "$(cat "$dir/ts")" >&3
                curl -fsSL https://tailscale.com/install.sh | sh || exit 1
                sudo tailscale up --authkey="$(cat "$dir/ts")" --hostname="gh-$(printf '%s' "$FLOW_LEASE" | tr -d '-')" --accept-dns=true --timeout=180s || exit 1
                rm -f "$dir/ts"
                sudo sh -c 'f=/etc/docker/daemon.json; [ -s $f ] || echo "{}" > $f; jq ". + {\"dns\": [\"100.100.100.100\"]}" $f > $f.new && mv $f.new $f'
                sudo systemctl restart docker
              elif [ "$code" != 204 ]; then
                exit 1
              fi
            fi
            # step images synced to GHCR are pulled from here (see SYNC_WORKFLOW_YAML)
            printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            ver=$(dl version.txt | tr -d '[:space:]')
            case "$(uname -m)" in aarch64|arm64) arch=arm64 ;; *) arch=amd64 ;; esac
            dl "flowrunner-$ver-linux-$arch.tar.gz" | tar -xz -C "$dir"
            "$dir/flowrunner" -mode build -parallel 2 -workdir "$dir/ws"
          } >/dev/null 2>&1 || { echo failed; exit 1; }
          echo done
